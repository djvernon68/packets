      summary: One neighbour's settings for one address family
      description: >-
        Policy is per neighbour *and* per family, which is where IOS
        puts it too: the same neighbour legitimately filters IPv4 and
        IPv6 differently, and a single per-neighbour route-map could not
        express that.
      responses:
        '200':
          description: The per-neighbour, per-family settings.
