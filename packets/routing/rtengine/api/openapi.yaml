openapi: 3.0.3

info:
  title: rtengine REST API
  version: 1.0.0
  description: >-
    The control plane of the rtengine routing engine, as HTTP. There are
    four kinds of thing an operator does -- read the engine, change the
    configuration, look at operational state, take an action -- and the
    four groups of endpoints below behave differently on purpose.


    Configuration URLs are the IOS hierarchy spelled as paths.
    `router bgp 65000 / neighbor 10.0.0.2 / remote-as 65001` is
    `PUT /router/bgp/65000/neighbor/10.0.0.2` with
    `{"remote-as": 65001}`, and `no neighbor 10.0.0.2` is a `DELETE` on
    the same URL. The vocabulary is not translated on the way through --
    IOS keywords are the JSON keys and the path segments -- so an
    operator who knows the CLI can guess the URL, and
    `show running-config` and this API describe the same document in
    the same words.


    Every change is optimistically concurrent. A read returns the
    configuration revision in `ETag`; a write that sends it back in
    `If-Match` is refused with 412 when somebody else committed in
    between, which is how a client avoids clobbering a change it never
    saw. A write with no `If-Match` is last-write-wins, which is what
    omitting the header asks for.


    Reads are redacted. A secret comes back as `"<redacted>"`, and
    writing that value back means "keep the stored secret" rather than
    "set the password to the word redacted". That is the whole reason
    read-edit-write is safe for a client that is not allowed to see the
    password it is preserving.


    A change is atomic or it did not happen. Validation, then every
    affected plugin's `prepare`, then the commit: a rejection anywhere
    leaves the running configuration and its revision exactly as they
    were, so a failed write never needs unpicking.


    Which `/show` and `/clear` paths exist depends on which plugins this
    engine has registered -- an engine with BGP answers more than one
    without -- so this document describes one rule for each and the two
    index endpoints enumerate what the engine you are talking to
    actually answers.

servers:
  - url: /api/v1
    description: >-
      Relative to wherever the engine's API is bound (`api.bind`,
      loopback by default). The version lives in the path rather than in
      a header because an operator pasting a URL into a bug report
      should be pasting something unambiguous; every path in this
      document is written without the `/api/v1` prefix because the
      prefix is here.

security:
  - bearerAuth: []

tags:
  - name: engine
    description: >-
      What this engine is and how it is doing. These are the endpoints
      something else reads -- a supervisor, a monitoring system, a
      deployment tool -- rather than the ones an operator drives.
  - name: configuration
    description: >-
      The configuration document, as a resource tree. `GET` reads a
      subtree with the revision in `ETag`, `PUT` creates or replaces it,
      `PATCH` merges into it, and `DELETE` is IOS `no`. A `PATCH` merges
      key by key and a JSON `null` removes a key, which is the only way
      to unset one field without sending the rest of the object back. A
      nested object merges rather than replacing; replacing a nested
      object outright is what `PUT` on its own URL is for.
  - name: operational-state
    description: >-
      `show ip bgp summary` is `GET /show/ip/bgp/summary`. The documents
      these return are the engine's own, unaltered: the contract is that
      the CLI and the API answer the same question with the same bytes.
  - name: actions
    description: >-
      Things that change running state without changing the
      configuration. They are `POST` because they are not idempotent and
      not free; enumerating them is a `GET`, because listing what can be
      done must not do any of it.

paths:

  /:
    get:
      tags: [engine]
      operationId: getServiceIndex
      summary: What this is, and where the rest of it lives
      description: >-
        A client that has not been told where the specification lives
        can find it here, and a human who typed the base URL into a
        browser gets something better than a 404. This is still behind
        the token when one is configured: the authentication hook runs
        before every route in this document.
      responses:
        '200':
          description: The service banner and its links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openapi.json:
    get:
      tags: [engine]
      operationId: getOpenApiDocument
      summary: This document, as JSON
      description: >-
        Served as JSON from a YAML source: YAML is what a human
        maintains and JSON is what tooling reads, and converting on the
        way out means there is only ever one document to keep true. It
        is read from disk and cached on first use, so an engine whose
        copy is missing still routes -- it just answers 500 here.
      responses:
        '200':
          description: The OpenAPI document describing this application.
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.0 document.
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /engine/status:
    get:
      tags: [engine]
      operationId: getEngineStatus
      summary: Identity and configuration
      description: >-
        What this engine is: name, version, revision, the plugins
        registered and the families they carry, and the REST layer's own
        view of itself. The bind, the authentication policy and the
        bridge counters are facts the engine has no way to know, and
        they are merged in here rather than given their own endpoint so
        that one question does not need two polls. For measurement --
        loop lag, table sizes, whether anything is wrong -- use
        `/engine/health`.
      responses:
        '200':
          description: The status document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /engine/health:
    get:
      tags: [engine]
      operationId: getEngineHealth
      summary: The health document, unmodified
      description: >-
        Exactly what `Engine.health()` returns, with nothing added,
        because a monitoring rule written against one must hold for the
        other and a probe must not see a different answer depending on
        which door it came through.


        This is the one endpoint that can be exempted from
        authentication, with `api.auth.allow-unauthenticated-health`:
        the thing polling it is usually a supervisor or a load balancer
        with nowhere to keep a secret, and the document contains no key
        material by construction.
      responses:
        '200':
          description: >-
            The health document. `status` is the roll-up; the sections
            below it say which subsystem produced it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /engine/plugins:
    get:
      tags: [engine]
      operationId: getEnginePlugins
      summary: The registered protocol plugins
      description: >-
        Which protocols this engine speaks, which address families each
        carries, and where each keeps its configuration. Worth reading
        before anything else that varies by plugin: the `/show` and
        `/clear` vocabularies and the `router` section of the
        configuration document all grow with this list.
      responses:
        '200':
          description: The registered plugins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugins'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /engine/config-schema:
    get:
      tags: [engine]
      operationId: getConfigSchema
      summary: The configuration schema, core plus every plugin's
      description: >-
        The vocabulary rather than the shape. This document describes
        what each configuration resource looks like; the schema is the
        complete answer to "what may I put in this document", and it
        grows when a plugin is registered, which a static document
        cannot express. Each node carries its `type` and its bounds, and
        a node of type `secret` is one that reads back as
        `"<redacted>"`.
      responses:
        '200':
          description: The schema tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSchema'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /running-config:
    get:
      tags: [configuration]
      operationId: getRunningConfig
      summary: The whole configuration document
      description: >-
        Secrets redacted. The `ETag` is the revision, so the ordinary
        HTTP idiom -- read, edit, write back with `If-Match` -- is
        exactly the optimistic concurrency the engine already
        implements.
      responses:
        '200':
          description: The running document.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      tags: [configuration]
      operationId: replaceRunningConfigPost
      summary: Replace the whole document atomically
      description: >-
        Validate, prepare with every affected plugin, then commit: a
        rejection anywhere leaves the running configuration and its
        revision exactly as they were. Anything absent from the body is
        removed, which is the point of a replace and the reason to send
        `If-Match`.


        Secrets written back as `"<redacted>"` keep their stored values.
        That is what makes it safe to `GET` this document, edit one
        unrelated field and `POST` it back without ever holding the
        password it contains.


        `POST` and `PUT` on this URL do the same thing. Both spellings
        are accepted because this is a replace of a document that
        already exists, which reads as `PUT`, reached through a URL that
        is not the document's own identity, which reads as `POST`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The complete configuration document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunningConfig'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [configuration]
      operationId: replaceRunningConfigPut
      summary: Replace the whole document atomically
      description: >-
        The same operation as `POST` on this URL, down to the last byte
        of the response; see its description for what a replace does to
        the keys you left out and to the secrets you did not send.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: The complete configuration document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunningConfig'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /show:
    get:
      tags: [operational-state]
      operationId: getShowIndex
      summary: Every operational view this engine answers
      description: >-
        The list is the union of the core's own views and every
        registered plugin's, so it is this engine's actual capability
        rather than what the documentation happened to know when it was
        written. Each entry carries the CLI spelling and the URL, which
        makes this the discovery mechanism that per-command routes would
        have been.


        `/show/` is the same URL, not a second one: the rule is
        registered once with `strict_slashes=False`, so both spellings
        are answered rather than one of them being redirected to the
        other. A 301 is a reasonable thing to serve a browser and a poor
        thing to serve an API client, which may not follow it.
      responses:
        '200':
          description: The views this engine answers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /show/{command}:
    parameters:
      - $ref: '#/components/parameters/Command'
    get:
      tags: [operational-state]
      operationId: showCommand
      summary: Answer one operational query
      description: >-
        The handler's document, unaltered: `engine.show(...)` and this
        endpoint return the same thing for the same command.


        The path is resolved against the registered views before it is
        dispatched, rather than being handed straight to the engine.
        Engine dispatch matches the longest registered prefix and passes
        the rest to the handler as arguments, which is right for a CLI
        and too permissive for a URL: a mistyped segment would arrive at
        a handler as an argument and be reported as a missing neighbour
        rather than as a bad URL. An unresolvable path is a 404 that
        names the index.


        Pagination keywords are the handler's, not this layer's: the BGP
        table pages by `offset`, the core's route table by `after`, and
        several views take neither. Sending one to a view that declares
        its keywords is a 400 naming the parameter; a view that takes
        arbitrary keywords ignores what it does not use, so read what
        came back rather than assuming a page was a page.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: >-
            The view's document. Its shape is the handler's own -- a
            summary, a table with `items` and `next`, a single object --
            so it is not constrained here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowResult'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /clear:
    get:
      tags: [actions]
      operationId: getClearIndex
      summary: Every action this engine offers
      description: >-
        A `GET`, even though the actions themselves are `POST`s:
        enumerating what can be done must not do any of it. As with
        `/show`, the list depends on the plugins registered here, and
        `/clear/` is the same URL rather than a second one.
      responses:
        '200':
          description: The actions this engine offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearIndex'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /clear/{command}:
    parameters:
      - $ref: '#/components/parameters/Command'
    post:
      tags: [actions]
      operationId: clearCommand
      summary: Run one action
      description: >-
        `clear ip bgp` is the most dangerous command an operator types
        at a BGP speaker, and the difference between its forms is the
        difference between a free operation and a minute of churn
        propagated to every peer. With no body at all, or with
        `{"soft": false}`, `POST /clear/ip/bgp` drops every session:
        both ends forget everything and relearn it. With
        `{"soft": "in"}` it does not -- inbound policy is re-run over
        the paths already held, and a ROUTE-REFRESH is sent when the
        capability was negotiated. `{"soft": "out"}` re-advertises this
        router's choices from the update group's record. Both soft forms
        are cheap.


        `POST /clear/ip/bgp/10.0.0.2` is deliberately a 404, and the
        body names `/clear/ip/bgp/neighbor/10.0.0.2` instead. It looks
        exactly like a request to clear one neighbour, but engine
        dispatch would match `clear ip bgp` and pass the address on as
        the first positional argument -- which that handler reads as the
        soft directive, because `clear ip bgp soft in` is a real CLI
        spelling. An address is not one of `in`/`out`/`both`, so the
        request would clear *every* session, softly, and nothing in the
        response would say so.


        A typo in `soft` is rejected rather than interpreted, for the
        same reason.
      requestBody:
        required: false
        description: >-
          Omit it entirely for a hard clear. The body takes no key other
          than `soft`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClearRequest'
      responses:
        '200':
          description: >-
            The handler's report, naming what was actually cleared and
            in which direction -- the only way for a client to confirm
            that a soft clear was soft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearResult'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'


  /router/bgp:
    get:
      tags: [configuration]
      operationId: getBgpInstances
      summary: The BGP instances, keyed by AS number
      description: >-
        One entry in v1: a second `router bgp` is a conflict rather than
        an invalid document, and it is reported as 409 when a write
        would create one. Nothing configured here is a 404 rather than
        an empty object -- the resource is the subtree, and a subtree
        that is not in the document is not there.
      responses:
        '200':
          description: The `router bgp` section, secrets redacted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BgpInstances'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /router/bgp/{asn}:
    parameters:
      - $ref: '#/components/parameters/Asn'
    get:
      tags: [configuration]
      operationId: getBgpInstance
      summary: One BGP instance
      description: >-
        The whole instance -- timers, bestpath, every neighbour and
        every address family -- with any neighbour password reading back
        as `"<redacted>"`.
      responses:
        '200':
          description: The instance, secrets redacted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BgpInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [configuration]
      operationId: putBgpInstance
      summary: Create or replace a BGP instance
      description: >-
        A replace: neighbours and families absent from the body are
        removed, and removing a neighbour drops its session. Use `PATCH`
        to change one setting, or `PUT` on the neighbour's own URL to
        replace just that neighbour.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BgpInstance'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [configuration]
      operationId: patchBgpInstance
      summary: Merge into a BGP instance
      description: >-
        Merged key by key into what is stored, so
        `{"bestpath": {"always-compare-med": true}}` leaves the rest of
        `bestpath` alone. A `null` removes a key. The merge is against
        the redacted document, so a neighbour's password survives a
        patch that never mentions it.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BgpInstance'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [configuration]
      operationId: deleteBgpInstance
      summary: Remove a BGP instance -- IOS `no router bgp`
      description: >-
        Every session this instance holds is torn down and everything it
        learned is withdrawn, including from the forwarding plane.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /router/bgp/{asn}/neighbor:
    parameters:
      - $ref: '#/components/parameters/Asn'
    get:
      tags: [configuration]
      operationId: getBgpNeighbors
      summary: The configured neighbours, keyed by address
      description: >-
        Configuration, not state: a neighbour appears here whether or
        not its session is up. For the sessions, use
        `GET /show/ip/bgp/summary`.
      responses:
        '200':
          description: The `neighbor` section, passwords redacted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BgpNeighbors'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /router/bgp/{asn}/neighbor/{addr}:
    parameters:
      - $ref: '#/components/parameters/Asn'
      - $ref: '#/components/parameters/Addr'
    get:
      tags: [configuration]
      operationId: getBgpNeighbor
      summary: One neighbour's configuration
      description: >-
        `password` reads back as `"<redacted>"`. Send that value back
        unchanged to keep the stored password; send a new string to
        change it; send `null` in a `PATCH` to remove it.
      responses:
        '200':
          description: The neighbour, password redacted.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BgpNeighbor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    put:
      tags: [configuration]
      operationId: putBgpNeighbor
      summary: Create or replace a neighbour
      description: >-
        Changing anything the two ends agreed on in OPEN, or anything
        about the transport -- `remote-as`, `local-as`, `password`,
        `ao`, `update-source`, `ttl-security`, `ebgp-multihop`,
        `passive`, `shutdown`, `timers`, `capability`, `port` -- resets
        the session. Everything else is applied to a running session in
        place. A replace therefore resets the session whenever it
        changes one of those, including by omitting it.


        Authentication is checked when the change is prepared, not when
        the session next connects: a kernel with no TCP-MD5 rejects a
        `password` here with 400, because finding out at connect time
        leaves the operator with a peer that will not come up and no
        explanation attached to the thing they typed.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BgpNeighbor'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [configuration]
      operationId: patchBgpNeighbor
      summary: Merge into a neighbour
      description: >-
        The safe way to change one field of a neighbour that has a
        password: the merge is against the redacted document, so a
        client can set `description` without ever holding the secret it
        is preserving.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BgpNeighbor'
      responses:
        '200':
          $ref: '#/components/responses/Mutation'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    delete:
      tags: [configuration]
      operationId: deleteBgpNeighbor
      summary: Remove a neighbour -- IOS `no neighbor`
      description: >-
        The session is closed with a NOTIFICATION and everything learned
        from it is withdrawn. To stop talking to a peer while keeping
