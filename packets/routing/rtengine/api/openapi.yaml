        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ApplyFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    patch:
      tags: [configuration]
      operationId: patchBgpNeighborAddressFamily
      summary: Merge into a neighbour's family settings
      description: >-
        `{"route-map": {"in": null}}` removes the inbound route-map and
        leaves the outbound one, which a `PUT` of the same object could
        not do without resending it.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
