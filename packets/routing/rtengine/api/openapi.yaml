      operationId: putBgpNeighborAddressFamily
      summary: Create or replace a neighbour's family settings
      description: >-
        The three policy objects compose and run in order: a
        prefix-list filters on the NLRI, a filter-list on the AS path,
        and a route-map can do both and rewrite attributes as well.
        Naming one that does not exist is accepted -- the chain simply
        matches nothing until it does -- so check the name.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
