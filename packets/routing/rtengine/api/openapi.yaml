    delete:
      tags: [configuration]
      operationId: deleteIpPrefixList
      summary: Remove an IPv4 prefix-list
      description: >-
        A neighbour still naming this list keeps naming it; the chain
        matches nothing until the list comes back. That is deliberate --
        refusing the delete would make the order in which an operator
        rewrites their policy part of the contract.
